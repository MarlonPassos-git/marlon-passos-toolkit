name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Selecione o pacote para publicar'
        required: true
        default: 'biome-config'
        type: choice
        options:
          - biome-config
          - eslint-config
          - all

jobs:
  publish_eslint:
    name: Publish ESLint Config
    if: github.event.inputs.package == 'eslint-config' || github.event.inputs.package == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate ESLint Config package
        run: pnpm --filter @m-p-toolkit/eslint-config exec npm pack --dry-run
      - name: Publish ESLint Config
        run: pnpm --filter @m-p-toolkit/eslint-config exec npm publish --access public --provenance

  publish_biome:
    name: Publish Biome Config
    if: github.event.inputs.package == 'biome-config' || github.event.inputs.package == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Biome Config package
        run: pnpm --filter @m-p-toolkit/biome-config exec npm pack --dry-run
      - name: Publish Biome Config
        run: pnpm --filter @m-p-toolkit/biome-config exec npm publish --access public --provenance
